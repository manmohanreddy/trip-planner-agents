[project]
name = "trip-planner-agents"
version = "0.1.0"
description = "Trip planning agent built on the Claude Agent SDK. Single-agent v1, designed to grow into a multi-agent orchestrator."
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
trip-planner = "trip_planner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trip_planner*"]
